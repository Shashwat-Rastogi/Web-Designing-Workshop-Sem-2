<body>
    <h2>Loops</h2>
    <script>
        var counter=0;
        while(counter<5){
            console.log(counter);
            counter+=1;
        }
        let count=5;
        for(let i=0;i<counter;i++){
            console.log(i);
        
        }
        let n=5;
        for(let i=1;i<=n;i++){
            for(let j=1;j<=i;j++){
                console.log("*");
            }
        }
    </script>
</body>
